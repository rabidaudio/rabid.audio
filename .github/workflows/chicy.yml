name: Deploy to chicy.online

on:
  push:
    branches:
      - main

jobs:
  deploy_main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: "npm"
      - run: npm install

      - name: Deploy
        run: |
          bin/bridgetown deploy
          npx chicy deploy output --message $(git rev-parse --short HEAD) --promote --wait
        env:
          BRIDGETOWN_ENV: production
          AWS_REGION: us-east-1
          CHICY_DEPLOY_KEY: ${{ secrets.CHICY_DEPLOY_KEY }}
